<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 권한 없음 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .denied-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card denied-card text-center p-5">
                <h1 class="display-5 fw-bold text-danger">403</h1>
                <h4 class="fw-bold mb-3">접근 권한이 없습니다</h4>
                <p class="text-muted mb-4">해당 기능은 관리자 권한이 있는 사용자만 접근할 수 있습니다.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/home}" class="btn btn-primary">홈으로</a>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">상품 목록</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/common :: practice-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
